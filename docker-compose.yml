services:
  webadbcontrol:
    build: .
    image: webadbcontrol:latest
    restart: unless-stopped
    environment:
      WEBADB_AUTH_TOKEN: ${WEBADB_AUTH_TOKEN:-}
      WEBADB_BEHIND_PROXY: "false"
    ports:
      - "8080:8080"
    volumes:
      - webadb-data:/opt/webadbcontrol/data
      - /dev/bus/usb:/dev/bus/usb
    devices:
      - /dev/bus/usb:/dev/bus/usb

volumes:
  webadb-data:
